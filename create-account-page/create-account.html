<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Learning Hub</title>

    <!-- Google Fonts Preconnect (makes loading faster) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Connect to css file styles.css -->
    <link rel="stylesheet" href="create-account.css">
    <link rel="stylesheet" href="../shared-items/tagSetup.css">
</head>
<body>
    <img src="../images/create-account-wave.png" alt="wave logo" class="create-account-background">
    <div class="create-account-page">
        <div class="left-create-account-div">
            <div class="hospital-logo-text">
                <img src="../images/hospital-logo.png" alt="Hospital cross logo" class="hospital-logo">
                <div class="hospital-name">
                    <h5>CommonSpirit Health</h5>
                    <h2>Volunteer Learning Portal</h2>
                    <p>St. Anthony North Hospital</p>
                </div>
            </div>
            <div class="horizontal-line"></div>
            <div class="paragraph-image-div">
                <p>
                    Empowering our volunteers with the knowledge 
                    and confidence to serve, grow, and make meaningful 
                    impact in every interaction.
                </p>
                <img src="../images/create-account-left-image.png" alt="Books logo" class="create-account-left-image-logo">
            </div>
        </div>
        <div class="right-login-div">
            <div class="login-feature-card">
                <div class="top-login-feature-card">
                    <div class="icon-circle">
                        <img src="../images/user-icon.png" alt="real-life" class="user-icon">
                    </div>
                    <h3>Create Your Account</h3>
                    
                </div>
                <div class="login-entries">
                    
                    <div class="name-input-div">
                        <label for="name">Name</label>
                        <div class="input-div">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="#3F249E" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="size-6" width="35px">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                            </svg>
                            <input type="name" id="name" name="name" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="email-input-div">
                        <label for="email">Email</label>
                        <div class="input-div">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="size-6" width="35px">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                            </svg>
                            <input type="email" id="email" name="email" placeholder="Enter your Email Addresss" required>
                        </div>
                    </div>

                    <div class="password-input-div">
                        <label for="password">Password</label>
                        <div class="input-div">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="lock-icon" width="35px">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
                            <button class="password-show-button" type="button" aria-label="Show password">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="eye-show-icon" width="25px">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                </svg>
                            </button>
                            <button class="password-hide-button" type="button" aria-label="Hide password" hidden>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="eye-hidden-icon" width="25px">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="password-input-div">
                        <label for="confirmPassword">Password Confirmation</label>
                        <div class="input-div">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="lock-icon" width="35px">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                            </svg>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Your Password" required>
                            <button class="password-show-button" type="button" aria-label="Show password">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="eye-show-icon" width="25px">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                </svg>
                            </button>
                            <button class="password-hide-button" type="button" aria-label="Hide password" hidden>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#3F249E" class="eye-hidden-icon" width="25px">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                        <p id="email-error"></p>
                    </div>
                </div>
                <div class="buttons-section">
                    <div class="signup-div">
                        <a id="signup-button" class="signup-button purple-button"> 
                            <img src="../images/user-icon.png" alt="User Icon" class="create-account-logo">
                            Create an Account
                        </a>
                    </div>
                    <div class="help-div">
                        <h5> Already have an account? </h5>
                        <a href="../login-page/login.html" class="login-button">Log in</a> 
                    </div>
                </div>
            </div>
            
        
        </div>
    </div>
            <!-- Connect to javascript file script.js  -->
    <script type="module" src="../javascript/script.js"></script>
</body>
</html>
